<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Easel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Cpath d='M16 6l8 4.5v9L16 24l-8-4.5v-9L16 6z' fill='none' stroke='white' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- 启动占位 -->
<div id="boot" class="center-screen">
  <div class="spinner"></div>
  <p>正在连接…</p>
</div>

<!-- 登录 -->
<div id="login" class="center-screen" hidden>
  <form id="loginForm" class="login-card">
    <div class="login-logo"></div>
    <h1>Easel</h1>
    <p class="muted" id="loginHint">输入管理员口令以继续</p>
    <label class="field">
      <span>管理员口令</span>
      <input id="passwordInput" type="password" autocomplete="current-password" required>
    </label>
    <button class="primary" type="submit">登录</button>
    <p class="error" id="loginError" hidden></p>
  </form>
</div>

<!-- 主界面 -->
<div id="app" hidden>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">Easel</span>
    </div>
    <div class="topbar-right">
      <span class="pill" id="domainLabel"></span>
      <a class="ghost" id="siteLink" href="/" target="_blank" rel="noopener">查看入口页</a>
      <button class="ghost" id="refreshBtn" type="button">刷新</button>
      <button class="ghost" id="logoutBtn" type="button">退出</button>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2>上传新项目</h2>
      <p class="muted small">
        选一个 ZIP 压缩包（或单个 HTML 文件），解压在你的浏览器里完成，然后分片上传到 R2。
        上传完成后即可通过 <code>项目名.<span class="root-domain"></span></code> 访问。
      </p>

      <div class="dropzone" id="dropzone" tabindex="0" role="button"
           aria-label="选择或拖入 ZIP / HTML 文件">
        <div class="dropzone-icon"></div>
        <p class="dropzone-title">把 ZIP 拖到这里，或<span class="link">点击选择文件</span></p>
        <p class="muted small">支持 .zip 与单个 .html / .htm；单文件 ≤50MB，解压后总量 ≤300MB</p>
        <input id="fileInput" type="file" accept=".zip,.html,.htm" hidden>
      </div>

      <div class="form-row">
        <label class="field">
          <span>项目名（决定子域名）</span>
          <div class="input-suffix">
            <input id="projectId" placeholder="my-site" autocomplete="off" spellcheck="false">
            <span class="suffix">.<span class="root-domain"></span></span>
          </div>
          <small class="hint" id="idHint"></small>
        </label>
        <label class="field">
          <span>标题（仅用于这里的列表显示）</span>
          <input id="projectTitle" placeholder="我的收藏页面" autocomplete="off">
          <small class="hint">留空则用项目名</small>
        </label>
      </div>

      <div class="plan-box" id="planBox" hidden></div>

      <div class="actions">
        <button class="primary" id="uploadBtn" type="button" disabled>开始上传</button>
        <button class="ghost" id="cancelBtn" type="button" hidden>取消</button>
        <span class="muted small" id="fileNameLabel"></span>
      </div>

      <div class="progress" id="progressWrap" hidden>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-meta">
          <span id="progressStage">准备中…</span>
          <span id="progressPercent">0%</span>
        </div>
      </div>

      <pre class="log" id="log" hidden></pre>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>已托管项目</h2>
        <span class="muted small" id="quotaLabel"></span>
      </div>
      <div class="quota-bar" id="quotaBar" hidden><div id="quotaFill"></div></div>
      <div class="grid" id="projects"></div>
      <p class="empty" id="emptyState" hidden>还没有项目。上面传一个压缩包就能开始。</p>
    </section>
  </main>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="/app.js"></script>
</body>
</html>
